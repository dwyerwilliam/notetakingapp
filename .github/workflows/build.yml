name: Build & Publish

on:
  push:
    branches: [ primary ]
    tags:
      - 'v*'
  pull_request:
    branches: [ primary ]

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'NotePad/NotePad.csproj'

jobs:
  build:
    name: Build (.NET 9.0)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release
        continue-on-error: true

  publish:
    name: Publish Windows x64
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/primary' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish self-contained
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:AssemblyVersion=${{ github.ref_name }} `
            -p:FileVersion=${{ github.ref_name }} `
            -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotePad-win-x64
          path: ./publish/
          retention-days: 30

      - name: Zip release
        run: Compress-Archive -Path ./publish/* -DestinationPath ./NotePad-${{ github.ref_name }}.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./NotePad-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
